<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Tengermoraj">
  <!--
    A favicon (index.html) nap + hullám grafikája önálló fájlként, telepíthető
    ikonnak. Az eredeti rajz 32x32-es koordinátákban készült; a csoport 10x-re
    nagyítva, középre illesztve kerül az 512x512-es lapra, hogy a `maskable`
    biztonsági zónán (a lap 80%-os átmérőjű középkörén) belül maradjon.
  -->
  <rect width="512" height="512" fill="#0f172a" />
  <g transform="translate(96 73.5) scale(10)" fill="none">
    <circle cx="16" cy="12" r="6" fill="#fbbf24" />
    <path d="M0 22c4 0 4-3 8-3s4 3 8 3 4-3 8-3 4 3 8 3" stroke="#38bdf8" stroke-width="3" />
    <path d="M0 29c4 0 4-3 8-3s4 3 8 3 4-3 8-3 4 3 8 3" stroke="#0ea5e9" stroke-width="3" />
  </g>
</svg>
